[package]
name = "chapter_12_backend_full"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
# argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
axum-extra = "0.12.6"
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.23"
dotenvy = "0.15.7"
jsonwebtoken = "10.4.0"
letter = "0.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive", "derive_nightly_features"] }
